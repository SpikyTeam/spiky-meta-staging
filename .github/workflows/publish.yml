name: publish meta

# Carries the launcher metadata (meta/index.json and meta/v1/**) from here to
# what serves it: the meta-v1.zip asset attached to the "meta" release, which
# the mc.spiky.team build unpacks, and that build is then republished.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject a tree that could only break the site
        run: |
          test -s meta/index.json
          test -d meta/v1

      - name: Bundle
        run: |
          # -X drops extra attributes so the same tree always gives the same zip layout
          rm -f /tmp/meta-v1.zip
          zip -qr -X /tmp/meta-v1.zip meta/index.json meta/v1

      - name: Attach meta-v1.zip to the meta release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .github/workflows/release-meta.sh

      - name: Republish mc.spiky.team
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gh workflow run pages.yml --repo SpikyTeam/mc.spiky.team
