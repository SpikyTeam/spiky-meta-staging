name: publish meta

# Carries the launcher metadata (index.json and v1/**) from here to what
# serves it: the meta-v1.zip asset attached to the "meta" release, which the
# mc.spiky.team build unpacks, and that build is then republished.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject a tree that could only break the site
        run: |
          if [ -d meta ] && [ -s meta/index.json ]; then root=meta; else root=.; fi
          test -s "$root/index.json"
          test -d "$root/v1"

      - name: Bundle
        run: |
          # -X drops extra attributes so the same tree always gives the same zip layout
          if [ -d meta ]; then src=meta; else src=.; fi
          rm -f /tmp/meta-v1.zip
          zip -qr -X /tmp/meta-v1.zip "$src/index.json" "$src/v1"

      - name: Attach meta-v1.zip to the meta release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .github/workflows/release-meta.sh

      - name: Republish mc.spiky.team
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gh workflow run pages.yml --repo SpikyTeam/mc.spiky.team
